server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: eureka-server
  client:
    # The registry itself does not need to register with or fetch from itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Faster eviction for a demo/dev environment (default is 90s)
    eviction-interval-timer-in-ms: 5000
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
